  const title=text('div',version.label??version.release_id,li);title.className='commit-title';title.title=title.textContent;
  text('small',sourceOf(version)?`${t('commit')}: ${sourceOf(version).slice(0,10)}`:t('geneOnly'),li).className='commit-meta';
 });
 $('release-tree').setAttribute('aria-label',t('releaseTree'));$('git-tree').setAttribute('aria-label',t('gitTree'));$('lineage-list').setAttribute('aria-label',t('lineageLabel'));
 $('git-unavailable').hidden=Boolean(gitGraph?.available);
 $('main-unavailable').hidden=!gitGraph?.available||Boolean(gitGraph.mainHead);
 const commits=gitGraph?.available?gitGraph.commits:[],bySha=new Map(commits.map(c=>[c.sha,c])),onMain=new Set(),queue=gitGraph?.mainHead?[gitGraph.mainHead]:[];
 // The API is topologically ordered: every visible ancestor has its full path from main in this window.
 while(queue.length){const sha=queue.pop();if(onMain.has(sha))continue;onMain.add(sha);queue.push(...(bySha.get(sha)?.parents??[]));}
 const refsBySha=new Map();for(const ref of gitGraph?.refs??[]){const refs=refsBySha.get(ref.sha)??[];refs.push(ref.ref);refsBySha.set(ref.sha,refs);}
 const layout=graphLayout(commits,gitGraph?.mainHead),included=commits.filter(c=>onMain.has(c.sha)).length;
 $('main-count').textContent=gitGraph?.mainHead?t('mainCount').replace('{count}',included):'';
 $('development-count').textContent=gitGraph?.mainHead?t('developmentCount').replace('{count}',commits.length-included):'';
 $('graph-window').textContent=gitGraph?.available?t('graphWindow').replace('{count}',commits.length):'';
 for(const [id,mode,palette] of [['release-list','main',['#2563eb','#0f766e','#0891b2']],['commit-list','development',['#7c3aed','#7c3aed','#c2410c']]]){
  const focused=commit=>Boolean(gitGraph?.mainHead)&&(mode==='main'?onMain.has(commit.sha):!onMain.has(commit.sha));
  drawDag($(id),commits,layout,focused,lane=>palette[lane%palette.length],(commit,li)=>{
   li.className='commit '+(focused(commit)?'focused':'muted')+(commit.sha===selectedSha?' selected':'');li.dataset.sha=commit.sha;li.dataset.membership=gitGraph?.mainHead?(onMain.has(commit.sha)?'main':'development'):'unknown';li.tabIndex=0;li.setAttribute('role','button');li.setAttribute('aria-pressed',String(commit.sha===selectedSha));
   const head=text('div','',li);head.className='commit-heading';text('span',commit.sha.slice(0,7),head).className='mono';
   const refs=text('span','',head);refs.className='commit-refs';for(const ref of refsBySha.get(commit.sha)??[]){const tag=text('span',ref.replace(/^refs\/(heads|remotes|tags)\//,''),refs);tag.className='branch-label';tag.title=ref;}
   const title=text('div',commit.subject,li);title.className='commit-title';title.title=commit.subject;
   const meta=text('div','',li);meta.className='commit-meta';text('span',`${commit.author} · ${new Date(Number(commit.time)*1000).toLocaleString(lang)}`,meta);
   for(const version of releasesBySha.get(commit.sha)??[]){const badge=stateBadge(`${version.id} · ${version.id===data.active?.id?t('activeTag'):t('releaseMark')}`,version.id===data.active?.id?'publish':'');badge.title=version.label??version.release_id;meta.append(badge);}
   li.onclick=()=>void selectCommit(commit.sha);li.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();void selectCommit(commit.sha);}};
  });
 }

}
async function selectCommit(sha){
 const request=++selectedRequest;
 selectedSha=sha;selectedDetail=null;selectedLoading=true;renderTrees(snapshot);renderSelectedCommit();
 try{const detail=await api('/api/git-commit/'+encodeURIComponent(sha));if(request===selectedRequest&&authenticated)selectedDetail=detail;}
 catch(error){if(request===selectedRequest)setError(error.message,'refresh');}
 finally{if(request===selectedRequest){selectedLoading=false;renderSelectedCommit();}}
}
function renderSelectedCommit(){
 const panel=$('selected-commit');panel.hidden=!selectedSha;
 if(!selectedSha)return;
 $('selected-sha').textContent=`${t('selectedCommit')}: ${selectedSha.slice(0,12)}`;
 const holder=$('selected-meta');
 if(selectedLoading){holder.replaceChildren();text('p',t('running'),holder);$('selected-ff').textContent='';$('selected-files').replaceChildren();$('prepare-commit').disabled=true;return;}
 if(!selectedDetail){holder.replaceChildren();$('prepare-commit').disabled=true;return;}
 const c=selectedDetail.commit;holder.replaceChildren();
 text('div',`${t('author')}: ${c.author}`,holder);
 text('div',`${t('commitTime')}: ${new Date(Number(c.time)*1000).toLocaleString(lang)}`,holder);
 text('div',`${t('parents')}: ${c.parents.map(p=>p.slice(0,10)).join(', ')||'—'}`,holder);
 if(selectedDetail.mainHead)text('div',`${t('mainHeadNow')}: ${selectedDetail.mainHead.slice(0,10)}`,holder).className='mono';
 const ff=$('selected-ff');
 if(selectedDetail.fastForwardable){ff.textContent=t('fastForwardOk');ff.className='';$('prepare-commit').disabled=Boolean(snapshot?.busy)||sending;
  if(selectedDetail.includedCommits?.length){const div=text('div',`${t('includedCommits')} (${selectedDetail.includedCommits.length})`,holder);text('div',selectedDetail.includedCommits.map(sha=>sha.slice(0,10)).join(' · '),div).className='mono';}
 } else {ff.textContent=t('fastForwardBlocked');ff.className='sync-note';$('prepare-commit').disabled=true;}
 const files=$('selected-files');files.replaceChildren();
 text('h4',t('changedFiles'),files);
 const list=text('ul','',files);list.className='file-list';
 for(const file of selectedDetail.files??[])text('li',`${file.status} ${file.name}`,list).className='mono';
}
async function loadGitGraph(){
 const request=++graphRequest;
 $('refresh-graph').disabled=true;
 try{const value=await api('/api/git-graph');if(request!==graphRequest||!authenticated)return;gitGraph=value;gitGraphFailed=false;}
 catch(error){if(request!==graphRequest||!authenticated)return;gitGraph=null;gitGraphFailed=true;}
 finally{if(request===graphRequest)$('refresh-graph').disabled=false;}
 if(snapshot)renderTrees(snapshot);
 selectedDetail=null;renderSelectedCommit();
 if(selectedSha&&gitGraph?.available)await selectCommit(selectedSha);
}
function renderGraph(data){
 const key=JSON.stringify([lang,data.active?.id,(data.versions??[]).map(v=>[v.id,v.state,v.label]),gitGraph?.available,gitGraph?.mainHead,gitGraph?.commits?.length,selectedSha,data.job?.error,data.job?.gitSyncState]);
 if(key===graphRenderKey)return;graphRenderKey=key;renderTrees(data);
 const note=$('git-sync-note');
 const job=data.job;
 if(job?.action==='publish'&&job.state==='succeeded'&&job.gitSyncState==='needs_git_sync'){note.hidden=false;note.textContent=t('needsGitSync');}
 else if(job?.action==='publish'&&job.state==='succeeded'&&job.gitSyncState==='synced'){note.hidden=false;note.textContent=t('gitSynced');}
 else if(job?.error&&String(job.error).startsWith('GIT_SYNC_BLOCKED:')){note.hidden=false;note.textContent=t('gitSyncBlocked')+' '+String(job.error).slice('GIT_SYNC_BLOCKED:'.length);}
 else note.hidden=true;
}
function renderSourceReport(){const key=JSON.stringify([lang,sourceReport?.hash,reportError,Boolean(snapshot?.busy),sending]);if(key===sourceRenderKey)return;sourceRenderKey=key;const section=$('code-report');section.hidden=!sourceReport&&!reportError;const holder=$('code-content');holder.replaceChildren();if(!sourceReport){if(reportError)text('p',t(reportError),holder);return;}text('h3',sourceReport.title,holder);text('p',`${t('reporter')}: ${sourceReport.personName} · ${sourceReport.baseGeneration}`,holder);text('p',sourceReport.summary,holder);text('p',t('codePending'),holder);text('code',`${t('reportHash')}: ${sourceReport.hash}`,holder);for(const file of sourceReport.files){const details=text('details','',holder);text('summary',file.path,details);text('pre',file.content??t('deleted'),details);}const label=text('label','',holder);label.className='check';const check=document.createElement('input');check.type='checkbox';check.checked=reviewed.has(sourceReport.hash);label.append(check);text('span',t('reviewCode'),label);const button=text('button',t('prepareCode'),holder);button.disabled=!check.checked||snapshot?.busy||sending;check.onchange=()=>{check.checked?reviewed.add(sourceReport.hash):reviewed.delete(sourceReport.hash);button.disabled=!check.checked||snapshot?.busy||sending;};button.onclick=()=>action({action:'prepare-code',id:sourceReport.id,hash:sourceReport.hash});}
async function refresh(){if(!authenticated||refreshing)return;refreshing=true;try{render(await api('/api/upgrades'));if(errorKind==='refresh')setError();
 const syncStamp=snapshot?.job?.action==='publish'&&snapshot?.job.state==='succeeded'?`${snapshot.job.startedAt}:${snapshot.job.gitSyncState??''}`:'';
 if(syncStamp&&syncStamp!==lastSyncStamp){lastSyncStamp=syncStamp;gitGraph=null;gitGraphFailed=false;}
 if(!gitGraph&&!gitGraphFailed)await loadGitGraph();else if(snapshot)renderGraph(snapshot);if(!reportAttempted&&reportQuery.get('report')){reportAttempted=true;try{const r=await api('/api/code-reports/'+encodeURIComponent(reportQuery.get('report')));if(r.hash!==reportQuery.get('reportHash'))throw new Error('APP_CODE_REPORT_CHANGED');sourceReport=r;}catch(e){reportError=e.message;}}renderSourceReport();}catch(error){if(error.message==='OWNER_LOGIN_REQUIRED'||errorKind!=='action')setError(error.message,'refresh');}finally{refreshing=false;}}
async function action(body){if(sending||snapshot?.busy)return;sending=true;setError();if(snapshot)render(snapshot);renderSourceReport();try{await api('/api/upgrades',body);await refresh();if(authenticated)$('job').scrollIntoView?.({block:'start'});}catch(error){setError(error.message,'action');}finally{sending=false;if(snapshot)render(snapshot);renderSourceReport();}}
$('login-form').onsubmit=async event=>{event.preventDefault();if(sending)return;sending=true;setError();try{await api('/api/login',{secret:$('secret').value});$('secret').value='';authenticated=true;$('login').hidden=true;$('content').hidden=false;await refresh();}catch(error){setError(error.message,'action');}finally{sending=false;if(snapshot)render(snapshot);}};
$('prepare-form').onsubmit=event=>{event.preventDefault();void action({action:'prepare',version:$('version').value,reason:$('reason').value});};
$('prepare-commit').onclick=()=>{if(!selectedSha||selectedDetail?.commit.sha!==selectedSha||!selectedDetail.fastForwardable||sending||snapshot?.busy)return;prepareTarget=selectedSha;$('commit-target').textContent=prepareTarget;$('commit-version').value=$('version').value;$('commit-reason').value=$('reason').value;$('commit-dialog').showModal();$('commit-reason').focus();};
$('commit-form').onsubmit=event=>{event.preventDefault();if(!prepareTarget||sending||snapshot?.busy)return;const body={action:'prepare',version:$('commit-version').value,reason:$('commit-reason').value,sourceCommit:prepareTarget};$('commit-dialog').close();prepareTarget=null;void action(body);};
$('commit-cancel').onclick=()=>{$('commit-dialog').close();prepareTarget=null;};$('commit-dialog').oncancel=()=>{prepareTarget=null;};
$('maintenance-form').onsubmit=event=>{event.preventDefault();if(!maintenance||sending||snapshot?.busy)return;const body={...maintenance.body,reason:$('maintenance-reason').value,...(maintenance.body.action==='rollback'?{deleteNewer:$('delete-newer').checked}:{})};$('maintenance-dialog').close();maintenance=null;void action(body);};
$('maintenance-cancel').onclick=()=>{$('maintenance-dialog').close();maintenance=null;};$('maintenance-dialog').oncancel=()=>{maintenance=null;};
$('recover').onclick=()=>action({action:'recover'});$('logout').onclick=async()=>{try{await api('/api/logout',{});showLogin();setError();}catch(error){setError(error.message,'action');}};
$('refresh-graph').onclick=()=>loadGitGraph();
const treeScrollers=[$('release-tree').querySelector('.graph-scroll'),$('git-tree').querySelector('.graph-scroll')];
for(const scroller of treeScrollers)scroller.onscroll=()=>{for(const other of treeScrollers)if(other!==scroller&&other.scrollTop!==scroller.scrollTop)other.scrollTop=scroller.scrollTop;};
for(const [id,value] of [['zh','zh-CN'],['en','en']])$(id).onclick=()=>{lang=value;localStorage.setItem('emergentinc.language',lang);translate();};
translate();try{authenticated=(await api('/api/session')).authenticated;if(authenticated){$('login').hidden=true;$('content').hidden=false;await refresh();}}catch(error){setError(error.message,'refresh');}
setInterval(refresh,2000);
</script></body></html>
