<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发布升级 · EmergentInc</title>
<style>body{margin:0;background:#f5f6f8;color:#17212f;font:16px/1.6 system-ui,sans-serif}main{max-width:900px;margin:40px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center}section{background:white;border:1px solid #e1e5eb;border-radius:12px;padding:24px;margin:20px 0}h1,h2{margin:0 0 12px}label{display:block;margin:12px 0}input,textarea{display:block;box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd2dc;border-radius:6px;font:inherit}button,a.button{border:0;border-radius:6px;padding:10px 16px;background:#204ecf;color:white;font:inherit;cursor:pointer;text-decoration:none}button:disabled{opacity:.45;cursor:default}header button{background:#e1e6f0;color:#17212f;padding:6px 12px}small{color:#536174}pre{overflow:auto;max-height:260px;background:#f3f5f8;padding:12px;white-space:pre-wrap;word-break:break-all}code{word-break:break-all}#error{color:#b42318}#job{border-left:4px solid #204ecf}label.check{display:flex;align-items:flex-start;gap:10px}label.check input{width:auto;margin-top:8px}.candidate{border-top:1px solid #e1e5eb;padding-top:16px;margin-top:16px}</style></head>
<body><main><header><h1 data-text="title"></h1><div><button id="zh">中文</button> <button id="en">EN</button></div></header>
<p data-text="intro"></p><p id="error" role="alert"></p>
<section id="login"><h2 data-text="login"></h2><form id="login-form"><label><span data-text="secret"></span><input id="secret" type="password" autocomplete="current-password" required></label><button data-text="login"></button></form></section>
<div id="content" hidden><section><h2 data-text="current"></h2><p id="active"></p><a class="button" id="back" data-text="back"></a></section>
<section id="job" hidden aria-live="polite"><h2 id="job-title"></h2><p id="job-state"></p><details><summary data-text="details"></summary><pre id="log"></pre></details><button id="recover" hidden data-text="recover"></button></section>
<section><h2 data-text="prepare"></h2><p data-text="prepareHint"></p><p id="dirty"></p><form id="prepare-form"><label><span data-text="version"></span><input id="version" value="v24-run-tips" required pattern="v[0-9]+([._-][a-zA-Z0-9]+)*"></label><label><span data-text="reason"></span><textarea id="reason" rows="2" maxlength="1000" required></textarea></label><button id="prepare" data-text="prepare"></button></form></section>
<section><h2 data-text="candidates"></h2><div id="candidates"></div></section><button id="logout" data-text="logout"></button></div></main>
<script type="module">
const words={
 'zh-CN':{title:'发布升级',intro:'准备并校验新版本，查看结果后点击发布。升级期间主服务会短暂重启，这个页面会保留进度。',login:'Owner 登录',secret:'本实例的 Owner 口令',current:'当前运行版本',back:'返回 QIAN',prepare:'准备并校验版本',prepareHint:'准备过程不会切换当前服务。源码需要先提交，校验通过后才可发布。',version:'版本标签',reason:'本次修改说明',candidates:'发布版本',empty:'暂无已准备的版本。',dirty:'源码尚未提交，请先提交修改再准备版本。',details:'查看校验记录',commit:'源码提交',hash:'版本校验标识',checked:'我已查看修改说明和校验结果，批准发布此版本。',publish:'发布升级',recover:'检查并恢复中断的升级',logout:'退出登录',preparing:'正在准备并校验版本',publishing:'正在发布升级',recovering:'正在检查恢复',running:'处理中…',succeeded:'操作完成。',failed:'操作失败，请查看校验记录。',interrupted:'操作曾中断，请检查并恢复。',validated:'校验通过，待发布',approved:'已批准，待发布',born:'已发布',submitted:'待校验',rolled_back:'已回退',loginError:'Owner 口令错误或登录尝试过多。',network:'无法连接升级服务。',source:'当前代',base:'来源代',pending:'升级尚未完成',VERSION_LABEL_AND_OWNER_REASON_REQUIRED:'请填写有效的版本标签和修改说明。',OWNER_RELEASE_REQUIRES_CLEAN_COMMITTED_CHECKOUT:'请先提交源码修改。',UPGRADE_ALREADY_RUNNING:'已有升级操作正在执行。',UPGRADE_CANDIDATE_CONFLICT:'版本或批准标识已变化，请刷新后重新检查。',ORIGIN_FORBIDDEN:'请求来源不匹配。',VERSION_UPGRADE_ACTION_INVALID:'不支持此操作。'},
 en:{title:'Publish upgrade',intro:'Prepare and validate a version, review the result, then publish. The main service briefly restarts during the upgrade; this page keeps showing progress.',login:'Owner login',secret:'Owner secret for this instance',current:'Current running version',back:'Back to QIAN',prepare:'Prepare and validate version',prepareHint:'Preparation keeps the current service running. Commit source changes first. Publication requires successful validation.',version:'Version label',reason:'Change description',candidates:'Release versions',empty:'No prepared versions yet.',dirty:'Source changes are uncommitted. Commit them before preparing a version.',details:'View validation records',commit:'Source commit',hash:'Version verification ID',checked:'I reviewed the changes and validation results and approve publishing this version.',publish:'Publish upgrade',recover:'Check and recover interrupted upgrade',logout:'Log out',preparing:'Preparing and validating version',publishing:'Publishing upgrade',recovering:'Checking recovery',running:'In progress…',succeeded:'Operation completed.',failed:'Operation failed. Check the validation records.',interrupted:'An operation was interrupted. Check and recover it.',validated:'Validated, ready to publish',approved:'Approved, ready to publish',born:'Published',submitted:'Awaiting validation',rolled_back:'Rolled back',loginError:'Invalid Owner secret or too many login attempts.',network:'Cannot connect to the upgrade service.',source:'Current generation',base:'Base generation',pending:'Upgrade incomplete',VERSION_LABEL_AND_OWNER_REASON_REQUIRED:'Enter a valid version label and change description.',OWNER_RELEASE_REQUIRES_CLEAN_COMMITTED_CHECKOUT:'Commit source changes first.',UPGRADE_ALREADY_RUNNING:'An upgrade operation is already running.',UPGRADE_CANDIDATE_CONFLICT:'The version or approval identifier changed. Refresh and review it again.',ORIGIN_FORBIDDEN:'Request origin does not match.',VERSION_UPGRADE_ACTION_INVALID:'Unsupported operation.'}
};
let lang=localStorage.getItem('emergentinc.language')==='en'?'en':'zh-CN',snapshot=null,authenticated=false,sending=false;
const reviewed=new Set();
const expanded=new Set();
const $=id=>document.getElementById(id),t=key=>words[lang][key]??key;
function translate(){document.documentElement.lang=lang;document.title=t('title')+' · EmergentInc';document.querySelectorAll('[data-text]').forEach(node=>node.textContent=t(node.dataset.text));if(snapshot)render(snapshot);}
function text(tag,value,parent){const node=document.createElement(tag);node.textContent=value;parent.append(node);return node;}
async function api(url,body){const response=await fetch(url,{credentials:'same-origin',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const value=await response.json();if(!response.ok){if(response.status===401)showLogin();throw new Error(value.detail??'network');}return value;}
function showLogin(){authenticated=false;$('login').hidden=false;$('content').hidden=true;}
function render(data){snapshot=data;$('active').textContent=data.active?`${t('source')}: ${data.active.id} · ${data.active.release_id}`:t('pending');$('back').href=data.appUrl+'/QIAN';$('dirty').textContent=data.dirty?t('dirty'):'';$('prepare').disabled=data.busy||data.dirty||sending;
 const job=data.job;$('job').hidden=!job;if(job){$('job-title').textContent=t(job.action==='prepare'?'preparing':job.action==='publish'?'publishing':'recovering');$('job-state').textContent=t(job.state);$('log').textContent=[job.error,job.log].filter(Boolean).join('\n');$('recover').hidden=!['failed','interrupted'].includes(job.state);$('recover').disabled=data.busy||sending;}
 const holder=$('candidates');holder.replaceChildren();if(!data.candidates.length)text('p',t('empty'),holder);
 for(const row of data.candidates){const card=text('article','',holder);card.className='candidate';text('h3',row.id,card);text('p',t(row.state.toLowerCase()),card);text('p',row.request.owner_release.reason,card);text('small',`${t('base')}: ${row.request.base_generation}`,card);
  if(row.candidate||row.validationLog){const details=text('details','',card);details.open=expanded.has(row.id);details.ontoggle=()=>details.open?expanded.add(row.id):expanded.delete(row.id);text('summary',t('details'),details);text('p',`${t('commit')}: ${row.request.owner_release.source_commit}`,details);if(row.candidate)text('code',`${t('hash')}: ${row.candidate.candidate_hash}`,details);if(row.validationLog)text('pre',row.validationLog,details);}
  if(row.failure_reason)text('pre',row.failure_reason,card);
  if(['VALIDATED','APPROVED'].includes(row.state)&&row.candidate?.base_generation===data.active?.id){const label=text('label','',card);label.className='check';const check=document.createElement('input');check.type='checkbox';check.checked=reviewed.has(row.candidate.candidate_hash);label.append(check);text('span',t('checked'),label);const button=text('button',t('publish'),card);button.disabled=!check.checked||data.busy||sending;check.onchange=()=>{check.checked?reviewed.add(row.candidate.candidate_hash):reviewed.delete(row.candidate.candidate_hash);button.disabled=!check.checked||data.busy||sending;};button.onclick=()=>action({action:'publish',id:row.id,hash:row.candidate.candidate_hash});}
 }
}
async function refresh(){if(!authenticated)return;try{render(await api('/api/upgrades'));$('error').textContent='';}catch(error){$('error').textContent=t(error.message);}}
async function action(body){if(sending||snapshot?.busy)return;sending=true;if(snapshot)render(snapshot);try{await api('/api/upgrades',body);await refresh();}catch(error){$('error').textContent=t(error.message);}finally{sending=false;if(snapshot)render(snapshot);}}
$('login-form').onsubmit=async event=>{event.preventDefault();try{await api('/api/login',{secret:$('secret').value});$('secret').value='';authenticated=true;$('login').hidden=true;$('content').hidden=false;await refresh();}catch{$('error').textContent=t('loginError');}};
$('prepare-form').onsubmit=event=>{event.preventDefault();void action({action:'prepare',version:$('version').value,reason:$('reason').value});};
$('recover').onclick=()=>action({action:'recover'});$('logout').onclick=async()=>{await api('/api/logout',{});showLogin();};
for(const [id,value] of [['zh','zh-CN'],['en','en']])$(id).onclick=()=>{lang=value;localStorage.setItem('emergentinc.language',lang);translate();};
translate();try{authenticated=(await api('/api/session')).authenticated;if(authenticated){$('login').hidden=true;$('content').hidden=false;await refresh();}}catch{$('error').textContent=t('network');}
setInterval(refresh,2000);
</script></body></html>
