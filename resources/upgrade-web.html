let lang=localStorage.getItem('emergentinc.language')==='en'?'en':'zh-CN',snapshot=null,authenticated=false,sending=false,refreshing=false,sourceReport=null,reportAttempted=false,reportError='',sourceRenderKey='',cardsRenderKey='',errorCode='',errorKind='',maintenance=null;

function showLogin(){sourceReport=null;reportAttempted=false;reportError='';snapshot=null;cardsRenderKey='';sourceRenderKey='';$('code-report').hidden=true;reviewed.clear();expanded.clear();authenticated=false;$('login').hidden=false;$('content').hidden=true;if($('maintenance-dialog').open)$('maintenance-dialog').close();maintenance=null;}

function renderMaintenance(){if(!maintenance)return;const rollback=maintenance.body.action==='rollback';$('maintenance-title').textContent=t(rollback?'rollingBack':'deletingRelease');$('maintenance-target').textContent=maintenance.label;$('maintenance-effect').textContent=t(rollback?'rollbackEffect':'deleteEffect');$('cleanup-option').hidden=!rollback;$('maintenance-confirm').textContent=t(rollback?'confirmRollback':'confirmDelete');$('maintenance-confirm').className=rollback?'':'danger';$('maintenance-confirm').disabled=Boolean(snapshot?.busy||sending);}
function render(data){snapshot=data;$('busy-state').hidden=!data.busy;$('active').textContent=data.active?`${t('source')}: ${data.active.id} · ${data.active.label??data.active.release_id??''}`:t('pending');$('back').href=data.appUrl+'/OWNER';$('dirty').textContent=data.dirty?t('dirty'):'';$('prepare').disabled=data.busy||data.dirty||sending;
 const job=data.job;$('job').hidden=!job;if(job){const actionName=t(['prepare','prepare-code'].includes(job.action)?'preparing':job.action==='validate'?'validating':job.action==='publish'?'publishing':job.action==='rollback'?'rollingBack':job.action==='delete'?'deletingRelease':'recovering');$('job-title').textContent=t('lastOperation')+' · '+actionName;$('job-state').textContent=t(job.error??job.state);if(job.action==='publish'&&['MAIN_SERVICE_UNAVAILABLE','MAIN_SERVICE_NOT_READY','LOCAL_CONTROL_PROCESS_IDENTITY_CONFLICT'].includes(job.error))$('job-state').textContent+=' '+t('publishBlocked');$('job-time').textContent=[job.version??job.id??job.targetGeneration,job.startedAt?`${t('jobStarted')}: ${new Date(job.startedAt).toLocaleString(lang)}`:'',job.finishedAt?`${t('jobFinished')}: ${new Date(job.finishedAt).toLocaleString(lang)}`:''].filter(Boolean).join(' · ');$('log').textContent=[job.error,job.log].filter(Boolean).join('\n');$('recover').hidden=!['failed','interrupted'].includes(job.state);$('recover').disabled=data.busy||sending;}
 const key=JSON.stringify([lang,data.active?.id,data.versions,data.candidates,data.busy,sending]);

function renderCards(data){const history=$('history');history.replaceChildren();
 for(const version of data.versions??[]){const card=text('article','',history);card.className='candidate';text('h3',`${version.id} · ${version.label}`,card);text('small',version.release_id,card);
   const record=data.candidates.find(row=>row.id===version.release_id),description=record?.request.owner_release?.reason??record?.request.app_code_report?.reason;
   if(description){text('small',t('reason'),card);text('p',description,card).style.whiteSpace='pre-wrap';}
   if(version.id===data.active?.id)text('p',t('current'),card);else if(!version.available)text('p',t('unavailable'),card);
   if(version.rollbackBlockedReason)text('p',t(version.rollbackBlockedReason),card);
   if(version.canRollback){const button=text('button',t('rollback'),card);button.disabled=data.busy||sending;button.onclick=()=>openMaintenance({action:'rollback',targetGeneration:version.id,expectedActive:data.active.id},`${version.id} · ${version.label}`);}
   if(version.canDelete){const button=text('button',t('deleteRelease'),card);button.disabled=data.busy||sending;button.className='danger';button.onclick=()=>openMaintenance({action:'delete',releaseId:version.release_id,expectedActive:data.active.id,identity:version.identity},`${version.id} · ${version.label}`);}
 }
 const holder=$('candidates'),archive=$('archived-candidates');holder.replaceChildren();archive.replaceChildren();let pending=0;
 for(const row of data.candidates){const currentBase=row.request.base_generation===data.active?.id,isPending=['SUBMITTED','VALIDATED','APPROVED'].includes(row.state)&&currentBase;const card=text('article','',isPending?holder:archive);if(isPending)pending++;card.className='candidate';text('h3',row.request.owner_release?.label??row.request.app_code_report?.title??row.id,card);text('small',`${t('releaseId')}: ${row.id}`,card);text('p',t(row.state==='DELETED'?'codeDeleted':row.state.toLowerCase()),card);text('p',row.request.owner_release?.reason??row.request.app_code_report?.reason??'',card);text('small',`${t('base')}: ${row.request.base_generation}`,card);
  if(['SUBMITTED','VALIDATED','APPROVED'].includes(row.state)&&!currentBase)text('p',t('staleCandidate'),card);
  if(row.candidate||row.validationLog){const details=text('details','',card);details.open=expanded.has(row.id);details.ontoggle=()=>details.open?expanded.add(row.id):expanded.delete(row.id);text('summary',t('details'),details);text('p',`${t('commit')}: ${row.request.owner_release?.source_commit??row.request.app_code_report?.hash??'—'}`,details);if(row.candidate)text('code',`${t('hash')}: ${row.candidate.candidate_hash}`,details);if(row.validationLog)text('pre',row.validationLog,details);}
  if(row.failure_reason)text('pre',row.failure_reason,card);
  if(row.canDelete&&!row.target_generation){const button=text('button',t('deleteRelease'),card);button.disabled=data.busy||sending;button.className='danger';button.onclick=()=>openMaintenance({action:'delete',releaseId:row.id,expectedActive:data.active.id,identity:row.identity},row.request.owner_release?.label??row.id);}
  if(row.state==='SUBMITTED'&&currentBase){const button=text('button',t('validate'),card);button.disabled=data.busy||sending;button.onclick=()=>action({action:'validate',id:row.id,identity:row.identity,expectedActive:data.active.id});}
  if(currentBase&&['VALIDATED','APPROVED'].includes(row.state)&&row.candidate?.base_generation===data.active?.id){const label=text('label','',card);label.className='check';const check=document.createElement('input');check.type='checkbox';check.checked=reviewed.has(row.candidate.candidate_hash);label.append(check);text('span',t('checked'),label);const button=text('button',t('publish'),card);button.disabled=!check.checked||data.busy||sending;check.onchange=()=>{check.checked?reviewed.add(row.candidate.candidate_hash):reviewed.delete(row.candidate.candidate_hash);button.disabled=!check.checked||data.busy||sending;};button.onclick=()=>action({action:'publish',id:row.id,hash:row.candidate.candidate_hash});}
 }
 if(!pending)text('p',t('empty'),holder);
}
function stateBadge(label,cls){const span=document.createElement('span');span.className='state-badge '+(cls||'');span.textContent=label;return span;}
function renderTrees(data){
 const releaseList=$('release-list');releaseList.replaceChildren();
 for(const version of (data.versions??[]).slice().sort((a,b)=>b.generation_no-a.generation_no)){
  const li=text('li','',releaseList);const node=document.createElement('span');
  node.className='node '+(version.id===data.active?.id?'current':version.state==='ROLLED_BACK'?'inactive':version.state==='FAILED'?'warn':'');
  li.append(node);text('span',`${version.id}`,li).className='mono';
  const label=version.label??version.release_id;text('span',String(label),li);
  const state=version.id===data.active?.id?t('activeTag'):version.state==='ROLLED_BACK'?t('rolledBackTag'):version.state==='FAILED'?t('failedTag'):version.state==='RETIRED'?t('retiredTag'):version.state;
  li.append(stateBadge(state,version.id===data.active?.id?'publish':version.state==='FAILED'?'warn':''));
  const record=data.candidates.find(row=>row.id===version.release_id),source=record?.request.owner_release?.source_commit;
  if(source){const s=text('small',`${t('commit')}: ${source.slice(0,10)}`,li);s.className='ref-tag mono';}
  else{text('small',t('geneOnly'),li).className='ref-tag';}
 }
 const commitList=$('commit-list');commitList.replaceChildren();
 $('git-unavailable').hidden=Boolean(gitGraph?.available);
 if(!gitGraph?.available)return;
 const bySha=new Map();for(const c of gitGraph.commits)bySha.set(c.sha,c);
 const refsBySha=new Map();
 for(const ref of gitGraph.refs){const list=refsBySha.get(ref.sha)??[];list.push(ref.ref);refsBySha.set(ref.sha,list);}
 for(const commit of gitGraph.commits){
  const li=text('li','',commitList);li.className='commit'+(commit.sha===selectedSha?' selected':'');
  const node=document.createElement('span');node.className='node '+(commit.sha===gitGraph.mainHead?'current':gitGraph.mainHead&&bySha.get(gitGraph.mainHead)&&isAncestorOf(gitGraph,gitGraph.mainHead,commit.sha)?'':'inactive');li.append(node);
  text('span',commit.sha.slice(0,7),li).className='mono';
  text('span',commit.subject,li).className='commit-title';
  for(const ref of refsBySha.get(commit.sha)??[]){const shortname=ref.replace(/^refs\/(heads|remotes|tags)\//,'');const tag=text('span',shortname,li);tag.className='branch-label';}
  const when=new Date(Number(commit.time)*1000);text('small',`${commit.author} · ${when.toLocaleString(lang)}`,li).className='ref-tag';
  li.onclick=()=>void selectCommit(commit.sha);
 }
}
function isAncestorOf(graph,ancestorSha,descendantSha){
 const seen=new Set(),queue=[descendantSha];
 while(queue.length){const sha=queue.pop();if(sha===ancestorSha)return true;if(seen.has(sha))continue;seen.add(sha);const commit=graph.commits.find(c=>c.sha===sha);if(commit)queue.push(...commit.parents);}
 return false;
}
async function selectCommit(sha){

 try{selectedDetail=await api('/api/git-commit/'+encodeURIComponent(sha));}
 catch(error){setError(error.message,'refresh');}
 finally{selectedLoading=false;renderSelectedCommit();}
}
function renderSelectedCommit(){
 const panel=$('selected-commit');panel.hidden=!selectedSha;
 if(!selectedSha)return;
 $('selected-sha').textContent=`${t('selectedCommit')}: ${selectedSha.slice(0,12)}`;
 const holder=$('selected-meta');
 if(selectedLoading){holder.replaceChildren();text('p',t('running'),holder);$('selected-ff').textContent='';$('selected-files').replaceChildren();$('prepare-commit').disabled=true;return;}
 if(!selectedDetail){holder.replaceChildren();return;}
 const c=selectedDetail.commit;holder.replaceChildren();
 text('div',`${t('author')}: ${c.author}`,holder);
 text('div',`${t('commitTime')}: ${new Date(Number(c.time)*1000).toLocaleString(lang)}`,holder);
 text('div',`${t('parents')}: ${c.parents.map(p=>p.slice(0,10)).join(', ')||'—'}`,holder);
 if(selectedDetail.mainHead)text('div',`${t('mainHeadNow')}: ${selectedDetail.mainHead.slice(0,10)}`,holder).className='mono';

  if(selectedDetail.includedCommits?.length>1){const div=text('div',`${t('includedCommits')} (${selectedDetail.includedCommits.length})`,holder);text('div',selectedDetail.includedCommits.map(sha=>sha.slice(0,10)).join(' · '),div).className='mono';}

async function loadGitGraph(){
 try{const value=await api('/api/git-graph');gitGraph=value;gitGraphFailed=false;}
 catch(error){gitGraph=null;gitGraphFailed=true;}
 if(snapshot)renderTrees(snapshot);
}
function renderGraph(data){
 const key=JSON.stringify([lang,data.active?.id,(data.versions??[]).map(v=>[v.id,v.state,v.label]),gitGraph?.available,gitGraph?.mainHead,gitGraph?.commits?.length,selectedSha]);
 if(key===graphRenderKey)return;graphRenderKey=key;renderTrees(data);
 const note=$('git-sync-note');
 const job=data.job;
 if(job?.action==='publish'&&job.state==='succeeded'&&job.gitSyncState==='needs_git_sync'){note.hidden=false;note.textContent=t('needsGitSync');}
 else if(job?.action==='publish'&&job.state==='succeeded'&&job.gitSyncState==='synced'){note.hidden=false;note.textContent=t('gitSynced');}
 else if(job?.error&&String(job.error).startsWith('GIT_SYNC_BLOCKED:')){note.hidden=false;note.textContent=t('gitSyncBlocked')+' '+String(job.error).slice('GIT_SYNC_BLOCKED:'.length);}
 else note.hidden=true;

function renderSourceReport(){const key=JSON.stringify([lang,sourceReport?.hash,reportError,Boolean(snapshot?.busy),sending]);if(key===sourceRenderKey)return;sourceRenderKey=key;const section=$('code-report');section.hidden=!sourceReport&&!reportError;const holder=$('code-content');holder.replaceChildren();if(!sourceReport){if(reportError)text('p',t(reportError),holder);return;}text('h3',sourceReport.title,holder);text('p',`${t('reporter')}: ${sourceReport.personName} · ${sourceReport.baseGeneration}`,holder);text('p',sourceReport.summary,holder);text('p',t('codePending'),holder);text('code',`${t('reportHash')}: ${sourceReport.hash}`,holder);for(const file of sourceReport.files){const details=text('details','',holder);text('summary',file.path,details);text('pre',file.content??t('deleted'),details);}const label=text('label','',holder);label.className='check';const check=document.createElement('input');check.type='checkbox';check.checked=reviewed.has(sourceReport.hash);label.append(check);text('span',t('reviewCode'),label);const button=text('button',t('prepareCode'),holder);button.disabled=!check.checked||snapshot?.busy||sending;check.onchange=()=>{check.checked?reviewed.add(sourceReport.hash):reviewed.delete(sourceReport.hash);button.disabled=!check.checked||snapshot?.busy||sending;};button.onclick=()=>action({action:'prepare-code',id:sourceReport.id,hash:sourceReport.hash});}
async function refresh(){if(!authenticated||refreshing)return;refreshing=true;try{render(await api('/api/upgrades'));if(errorKind==='refresh')setError();
 const syncStamp=snapshot?.job?.action==='publish'&&snapshot?.job.state==='succeeded'?`${snapshot.job.startedAt}:${snapshot.job.gitSyncState??''}`:'';
 if(syncStamp&&syncStamp!==lastSyncStamp){lastSyncStamp=syncStamp;gitGraph=null;gitGraphFailed=false;}

async function action(body){if(sending||snapshot?.busy)return;sending=true;setError();if(snapshot)render(snapshot);renderSourceReport();try{await api('/api/upgrades',body);await refresh();}catch(error){setError(error.message,'action');}finally{sending=false;if(snapshot)render(snapshot);renderSourceReport();}}
$('login-form').onsubmit=async event=>{event.preventDefault();if(sending)return;sending=true;setError();try{await api('/api/login',{secret:$('secret').value});$('secret').value='';authenticated=true;$('login').hidden=true;$('content').hidden=false;await refresh();}catch(error){setError(error.message,'action');}finally{sending=false;if(snapshot)render(snapshot);}};

$('maintenance-form').onsubmit=event=>{event.preventDefault();if(!maintenance||sending||snapshot?.busy)return;const body={...maintenance.body,reason:$('maintenance-reason').value,...(maintenance.body.action==='rollback'?{deleteNewer:$('delete-newer').checked}:{})};$('maintenance-dialog').close();maintenance=null;void action(body);};
