<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>版本切换 · EmergentInc</title><style>body{margin:0;background:#f5f6f8;color:#17212f;font:16px/1.6 system-ui,sans-serif}main{max-width:1180px;margin:40px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center}section{background:white;border:1px solid #e1e5eb;border-radius:12px;padding:24px;margin:20px 0}h1,h2{margin:0 0 12px}label{display:block;margin:12px 0}input,textarea{display:block;box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd2dc;border-radius:6px;font:inherit}button,a.button{border:0;border-radius:6px;padding:10px 16px;background:#204ecf;color:white;font:inherit;cursor:pointer;text-decoration:none}button:disabled{opacity:.45;cursor:default}header button{background:#e1e6f0;color:#17212f;padding:6px 12px}small{color:#536174}pre{overflow:auto;max-height:260px;background:#f3f5f8;padding:12px;white-space:pre-wrap;word-break:break-all}code{word-break:break-all}#error,#login-error{color:#b42318;white-space:pre-wrap;scroll-margin:24px}#commit-target{overflow-wrap:anywhere}nav{display:flex;gap:18px;flex-wrap:wrap}section{scroll-margin-top:20px}dialog{border:1px solid #cbd2dc;border-radius:12px;padding:24px;max-width:540px;width:calc(100% - 80px)}dialog::backdrop{background:#17212f66}.actions[hidden]{display:none}.actions{display:flex;gap:12px;flex-wrap:wrap}.secondary{background:#e1e6f0;color:#17212f}.danger{background:#b42318}.candidate button{margin-right:10px}.badge{color:#204ecf}.archive{margin:20px 0}#job-time{font-size:14px}#job{border-left:4px solid #204ecf;padding-left:12px;margin-top:16px}#graph-pagination{align-items:center;justify-content:center}label.check{display:flex;align-items:flex-start;gap:10px}label.check input{width:auto;margin-top:8px}h3,#active{overflow-wrap:anywhere}small{display:block;color:#657084}.candidate{border-top:1px solid #e1e5eb;padding-top:16px;margin-top:16px}.mono{font-family:ui-monospace,monospace;font-size:12px}.commit{cursor:pointer;outline-offset:-2px}.commit.focused{background:#f0f6ff}.commit.muted{color:#929baa;background:#fafbfc}.commit.muted .branch-label{color:#929baa;border-color:#e1e5eb;background:#f1f3f6}.commit:hover{background:#eaf0fa}.commit:focus-visible,.commit.selected{outline:2px solid #204ecf;background:#e8efff}.commit-heading{display:flex;align-items:center;gap:8px;height:19px;min-width:0}.commit-refs{display:flex;gap:5px;overflow:hidden}.branch-label{display:inline-block;padding:0 5px;border:1px solid #bcd0f4;border-radius:4px;background:#e7effd;color:#2353a1;font-size:10px;white-space:nowrap;max-width:145px;overflow:hidden;text-overflow:ellipsis}.commit-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:23px}.commit-meta{display:flex;align-items:center;gap:8px;font-size:10px;line-height:17px;white-space:nowrap;overflow:hidden;color:inherit}.commit-meta .state-badge{font-size:10px;padding:0 6px;flex:none}.state-badge{font-size:12px;padding:2px 8px;border-radius:10px;background:#e1e6f0;color:#17212f}.state-badge.publish{background:#0e9f6e;color:white}.state-badge.warn{background:#b54708;color:white}.state-badge.off{background:#98a2b3;color:white}.sync-note{margin:8px 0;padding:8px 12px;border-radius:6px;background:#fef0c7;color:#93370d;font-size:14px}.main-timeline{margin:24px 0}.main-step{display:grid;grid-template-columns:minmax(240px,1fr) minmax(240px,1fr);gap:28px;position:relative;padding:0 0 20px 24px;border-left:3px solid #2563eb;margin-left:8px}.main-step::before{content:'';position:absolute;left:-8px;top:20px;width:13px;height:13px;background:#2563eb;border:2px solid white;border-radius:50%}.main-node,.branch-card{border:1px solid #dfe4ec;border-radius:8px;padding:12px;background:#fff;min-width:0}.main-node.selected,.branch-card .selected{outline:2px solid #204ecf;background:#e8efff}.branch-card{position:relative;margin-bottom:12px;background:#faf8ff;border-color:#d7c6fa}.branch-card::before{content:'';position:absolute;left:-29px;top:23px;width:28px;border-top:2px solid #b39adb}.branch-card h3{font-size:14px;margin:0 0 6px;overflow-wrap:anywhere}.branch-card button.commit{display:block;width:100%;text-align:left;color:inherit;background:transparent;padding:6px 0}.branch-card details{font-size:13px}.main-node{align-self:start;display:block;text-align:left;width:100%}.main-node .commit-title{white-space:normal;font-weight:600}.branch-source{font-size:12px;overflow-wrap:anywhere;color:#657084}#delete-branch{font:inherit;padding:8px;max-width:100%}#selected-commit{box-sizing:border-box;max-height:calc(100vh - 16px);overflow:auto;position:sticky;top:8px;z-index:2;border:1px solid #dfe4ec;border-radius:8px;padding:12px;background:white;box-shadow:0 4px 16px #17212f18}#selected-meta{white-space:pre-wrap}@media(max-width:700px){.main-step{grid-template-columns:1fr;gap:12px}.branch-card{margin-left:16px}.branch-card::before{left:-18px;width:17px}}.main-column{min-width:0;align-self:start}.merged-history{font-size:13px;margin-top:8px}.merged-history>button{display:block;text-align:left;width:100%;padding:8px;color:inherit;background:#f8fafc;margin-top:6px}</style></head><body><main><header><h1 data-text="title"></h1><button id="language">EN / 中文</button></header>

<div id="content" hidden><section><h2 data-text="current"></h2><p id="active"></p><a id="back" class="button" href="http://127.0.0.1:8765/OWNER" data-text="back"></a></section>

function renderTrees(data){
 const signature=JSON.stringify([gitGraph,data.active?.id,data.versions?.map(v=>[v.id,v.release_id]),lang,selectedSha,selectedMode]);
 if(signature===treeSignature)return;treeSignature=signature;
 const holder=$('git-timeline'),opened=new Set([...holder.querySelectorAll('.branch-card')].filter(card=>card.querySelector('details')?.open).map(card=>card.dataset.branch)),openedMain=new Set([...holder.querySelectorAll('.main-step')].filter(row=>row.querySelector('.merged-history')?.open).map(row=>row.dataset.mainSha));holder.replaceChildren();
 $('git-unavailable').hidden=Boolean(gitGraph?.available);$('main-unavailable').hidden=!gitGraph?.available||Boolean(gitGraph.mainHead);
 const commits=gitGraph?.commits??[],bySha=new Map(commits.map(c=>[c.sha,c])),refsBySha=new Map(),shown=new Set();
 for(const ref of gitGraph?.refs??[]){const refs=refsBySha.get(ref.sha)??[];refs.push(ref.ref);refsBySha.set(ref.sha,refs);}
 const records=new Map(data.candidates.map(row=>[row.id,row])),versions=data.versions??[];
 function commitNode(sha,parent,mode){
  shown.add(sha);
  const commit=bySha.get(sha)??{sha,subject:sha.slice(0,12),author:'',time:0};
  const node=text('button','',parent);node.type='button';node.className='commit'+(selectedSha===sha&&selectedMode===mode?' selected':'');node.dataset.sha=sha;node.dataset.mode=mode;
  node.setAttribute('aria-pressed',String(selectedSha===sha&&selectedMode===mode));
  const head=text('div','',node);head.className='commit-heading';text('span',sha.slice(0,7),head).className='mono';
  for(const ref of refsBySha.get(sha)??[])text('span',ref.replace(/^refs\/(heads|remotes|tags)\//,''),head).className='branch-label';
  text('div',commit.subject,node).className='commit-title';
  const meta=text('div',commit.time?`${commit.author} · ${new Date(commit.time*1000).toLocaleString(lang)}`:'',node);meta.className='commit-meta';
  for(const version of versions){if(records.get(version.release_id)?.request.owner_release?.source_commit===sha)meta.append(stateBadge(`${version.id} · ${version.id===data.active?.id?t('activeTag'):t('releaseMark')}`,version.id===data.active?.id?'publish':''));}
  node.onclick=()=>void selectCommit(sha,mode);return node;
 }
 function branchCard(branch,parent){
  const visible=(branch.commits??[]).filter(sha=>bySha.has(sha)&&!shown.has(sha));if(!visible.length)return;
  const card=text('div','',parent);card.className='branch-card';card.dataset.branch=branch.ref;
  text('h3',branch.ref.replace(/^refs\/(heads|remotes)\//,''),card);
  text('p',`${t(branch.ref.startsWith('refs/remotes/')?'remoteBranch':'temporaryBranch')} · ${t(branch.merged?'merged':'unmerged')}`,card).className='branch-source';
  text('p',`${t('forkSource')}: ${branch.base?.slice(0,12)??'—'}`,card).className='branch-source';
  commitNode(visible[0],card,'merge');
  const history=visible.slice(1);
  if(history.length){const details=text('details','',card);details.open=opened.has(branch.ref);text('summary',t('branchHistory'),details);for(const sha of history)commitNode(sha,details,'merge');}
 }
 const placed=new Set(),known=new Set(),mergedHistory=new Map();
 const collect=(sha,output)=>{if(known.has(sha)||!bySha.has(sha))return;known.add(sha);if(output)output.push(sha);for(const parent of bySha.get(sha).parents)collect(parent,output);};
 for(const sha of [...(gitGraph?.firstParent??[])].reverse()){
  const commit=bySha.get(sha),introduced=[];if(!commit)continue;
  collect(commit.parents[0]);for(const parent of commit.parents.slice(1))collect(parent,introduced);known.add(sha);mergedHistory.set(sha,introduced);
 }
 for(const sha of gitGraph?.firstParent??[]){
  const row=text('div','',holder);row.className='main-step';row.dataset.mainSha=sha;
  const column=text('div','',row),node=commitNode(sha,column,sha===gitGraph.mainHead?'merge':'restore');column.className='main-column';node.classList.add('main-node');node.style.color='inherit';node.style.backgroundColor='white';
  const history=mergedHistory.get(sha)??[];if(history.length){const details=text('details','',column);details.className='merged-history';details.open=openedMain.has(sha);text('summary',t('mergedHistory'),details);for(const source of history)commitNode(source,details,'restore');}
  const forks=text('div','',row);
  for(const branch of gitGraph.branches??[]){if(branch.base===sha){branchCard(branch,forks);placed.add(branch.ref);}}
 }
 const remaining=(gitGraph?.branches??[]).filter(branch=>!placed.has(branch.ref));
 if(remaining.length){const group=text('div','',holder);text('h3',t('otherBranches'),group);for(const branch of remaining)branchCard(branch,group);}
 const extra=commits.filter(commit=>!shown.has(commit.sha));
 if(extra.length){const details=text('details','',holder);details.className='merged-history';text('summary',t('otherCommits'),details);for(const commit of extra)commitNode(commit.sha,details,known.has(commit.sha)?'restore':'merge');}
 $('graph-window').textContent=gitGraph?.available?t('graphWindow').replace('{page}',graphPage+1).replace('{count}',commits.length):'';
}

function showError(message){$(authenticated?'error':'login-error').textContent=t(message);if(authenticated)$('selected-commit').hidden=false;}
function renderPagination(){const disabled=requestedPage!==null||sending||snapshot?.busy||!gitGraph?.available;$('previous-page').disabled=disabled||graphPage===0;$('next-page').disabled=disabled||!gitGraph?.hasMore;}

function render(data){
 snapshot=data;$('active').textContent=data.active?`${data.active.id} · ${currentSource()?.slice(0,12)??t('geneOnly')}`:'—';$('back').href=data.appUrl+'/OWNER';renderTrees(data);

 const included=selectedMode==='merge'&&selectedDetail?.includedInMain&&currentSource()===selectedDetail.mainHead;
 const same=Boolean(selectedSha&&selectedSha===currentSource()),blocked=data.job?.state==='needs_git_sync';

async function refresh(page=graphPage){
 if(!authenticated)return;
 if(page!==graphPage)requestedPage=page;
 renderPagination();if(refreshing)return;refreshing=true;
 try{
 const [data,graph]=await Promise.all([api('/api/upgrades'),api('/api/git-graph?limit=20&page='+page)]);gitGraph=graph;graphPage=graph.page??page;render(data);

  seenSwitch=data.job.startedAt;
