us:10px;overflow:hidden;background:#fff}.tree-header{padding:14px 16px 12px;border-bottom:1px solid #e1e5eb;background:#f8fafc}.tree h3{margin:0 0 8px;font-size:16px}.tree-header small{font-size:12px;margin-top:8px}.graph-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.graph-toolbar h2{margin:0}.graph-toolbar button{flex:none;font-size:13px;padding:7px 12px}.graph-legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:#657084}.graph-legend span{display:inline-flex;align-items:center;gap:6px}.graph-legend span::before{content:'';width:8px;height:8px;border-radius:50%;background:#bdc5d1}.graph-legend .legend-main::before{background:#2563eb}.graph-legend .legend-development::before{background:#7c3aed}.graph-scroll{max-height:546px;overflow:auto;scrollbar-gutter:stable;overscroll-behavior:contain}.dag{position:relative;min-width:0;isolation:isolate}.dag svg{position:absolute;left:0;top:0;z-index:1;pointer-events:none}.dag ul{list-style:none;margin:0;padding:0}.dag li{height:78px;box-sizing:border-box;padding:8px 10px 8px calc(var(--graph-width) + 8px);font-size:13px;border-bottom:1px solid #edf0f5}.mono{font-family:ui-monospace,monospace;font-size:12px}.commit{cursor:pointer;outline-offset:-2px}.commit.focused{background:#f0f6ff}.commit.muted{color:#929baa;background:#fafbfc}.commit.muted .branch-label{color:#929baa;border-color:#e1e5eb;background:#f1f3f6}.commit:hover{background:#eaf0fa}.commit:focus-visible,.commit.selected{outline:2px solid #204ecf;background:#e8efff}.commit-heading{display:flex;align-items:center;gap:8px;height:19px;min-width:0}.commit-refs{display:flex;gap:5px;overflow:hidden}.branch-label{display:inline-block;padding:0 5px;border:1px solid #bcd0f4;border-radius:4px;background:#e7effd;color:#2353a1;font-size:10px;white-space:nowrap;max-width:145px;overflow:hidden;text-overflow:ellipsis}.commit-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:23px}.commit-meta{display:flex;align-items:center;gap:8px;font-size:10px;line-height:17px;white-space:nowrap;overflow:hidden;color:inherit}.commit-meta .state-badge{font-size:10px;padding:0 6px;flex:none}.commit.focused .commit-title{font-weight:600}.commit.focused .commit-meta{color:#657084}#git-tree .commit.focused{background:#f5f0ff}#git-tree .commit.focused .branch-label{background:#ede5ff;border-color:#d7c6fa;color:#6d28d9}#git-tree .commit.selected{background:#ece3ff}#graph-window{margin-top:10px}.release-lineage{margin-top:16px;border:1px solid #e1e5eb;border-radius:8px}.release-lineage summary{cursor:pointer;padding:10px 14px;font-size:14px;color:#536174}.release-lineage .graph-scroll{border-top:1px solid #e1e5eb;max-height:312px}.release-lineage .commit-meta{color:#657084}.selected-commit{border:1px solid #cbd2dc;border-radius:8px;padding:12px;margin-top:12px;background:white}.selected-commit .mono{display:block}.file-list{font-size:13px;max-height:180px;overflow:auto}.state-badge{font-size:12px;padding:2px 8px;border-radius:10px;background:#e1e6f0;color:#17212f}.state-badge.publish{background:#0e9f6e;color:white}.state-badge.warn{background:#b54708;color:white}.state-badge.off{background:#98a2b3;color:white}.sync-note{margin:8px 0;padding:8px 12px;border-radius:6px;background:#fef0c7;color:#93370d;font-size:14px}@media(max-width:900px){#graph-section .trees{grid-template-columns:1fr}.graph-toolbar{align-items:flex-start;flex-wrap:wrap}}</style></head><body><main><header><h1 data-text="title"></h1><button id="language">EN / 中文</button></header><p id="error" role="alert"></p>

const graphRowHeight=78;
function graphLayout(commits,root){
 const bySha=new Map(commits.map(c=>[c.sha,c])),primary=new Set();
 for(let sha=root;sha&&!primary.has(sha);sha=bySha.get(sha)?.parents[0])primary.add(sha);
 const lanes=[root??null],positions=new Map();let maxLane=0;
 const freeLane=()=>{let lane=1;while(lanes[lane])lane++;return lane;};
 for(const [index,commit] of commits.entries()){
  let lane=primary.has(commit.sha)?0:lanes.indexOf(commit.sha);
  if(lane<0)lane=freeLane();
  positions.set(commit.sha,{lane,x:20+lane*30,y:index*graphRowHeight+graphRowHeight/2});maxLane=Math.max(maxLane,lane);
  for(let i=0;i<lanes.length;i++)if(lanes[i]===commit.sha)lanes[i]=null;
  for(const [i,parent] of commit.parents.entries()){
   if(primary.has(parent))lanes[0]=parent;
   else if(!lanes.includes(parent))lanes[i===0&&lane>0&&!lanes[lane]?lane:freeLane()]=parent;
  }
 }
 return {positions,width:Math.max(64,40+maxLane*30),height:commits.length*graphRowHeight};
}
function svgElement(tag,attributes,parent){const node=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [key,value] of Object.entries(attributes))node.setAttribute(key,String(value));parent.append(node);return node;}
function drawDag(list,commits,layout,focused,colorFor,buildRow){
 const holder=list.parentElement;holder.querySelector('svg')?.remove();list.replaceChildren();holder.style.setProperty('--graph-width',layout.width+'px');
 const svg=svgElement('svg',{width:layout.width,height:layout.height,'aria-hidden':'true'},holder);holder.insertBefore(svg,list);
 for(const commit of commits){const point=layout.positions.get(commit.sha),color=focused(commit)?colorFor(point.lane):'#c4cad4';
  for(const [i,parent] of commit.parents.entries()){
   const target=layout.positions.get(parent),end=target??{x:point.x+i*12,y:point.y+28};
   const d=point.x===end.x?`M ${point.x} ${point.y} L ${end.x} ${end.y}`:`M ${point.x} ${point.y} C ${point.x} ${point.y+34}, ${end.x} ${end.y-34}, ${end.x} ${end.y}`;
   svgElement('path',{d,fill:'none',stroke:color,'stroke-width':2.5,'stroke-linecap':'round',class:'graph-edge'+(target?'':' continuation'),'data-child':commit.sha,'data-parent':parent,...(target?{}:{'stroke-dasharray':'4 5'})},svg);
  }
 }
 for(const commit of commits){const point=layout.positions.get(commit.sha),color=focused(commit)?colorFor(point.lane):'#b5bdca';
  svgElement('circle',{cx:point.x,cy:point.y,r:6,fill:color,stroke:'white','stroke-width':2,'data-sha':commit.sha},svg);
  buildRow(commit,text('li','',list));
 }
}
function renderTrees(data){
 const scrollers=[...document.querySelectorAll('#graph-section .graph-scroll')],scrolls=scrollers.map(node=>[node.scrollTop,node.scrollLeft]);
 const versions=(data.versions??[]).slice().sort((a,b)=>b.generation_no-a.generation_no),records=new Map(data.candidates.map(row=>[row.id,row]));
 const sourceOf=version=>records.get(version.release_id)?.request.owner_release?.source_commit??records.get(version.release_id)?.candidate?.source_commit;
 const releasesBySha=new Map();for(const version of versions){const sha=sourceOf(version);if(sha){const releases=releasesBySha.get(sha)??[];releases.push(version);releasesBySha.set(sha,releases);}}
 $('release-tree').setAttribute('aria-label',t('releaseTree'));$('git-tree').setAttribute('aria-label',t('gitTree'));
 $('git-unavailable').hidden=Boolean(gitGraph?.available);
 $('main-unavailable').hidden=!gitGraph?.available||Boolean(gitGraph.mainHead);
 const commits=gitGraph?.available?gitGraph.commits:[],bySha=new Map(commits.map(c=>[c.sha,c])),onMain=new Set(),queue=gitGraph?.mainHead?[gitGraph.mainHead]:[];
 // The API is topologically ordered: every visible ancestor has its full path from main in this window.
 while(queue.length){const sha=queue.pop();if(onMain.has(sha))continue;onMain.add(sha);queue.push(...(bySha.get(sha)?.parents??[]));}
 const refsBySha=new Map();for(const ref of gitGraph?.refs??[]){const refs=refsBySha.get(ref.sha)??[];refs.push(ref.ref);refsBySha.set(ref.sha,refs);}
 const layout=graphLayout(commits,gitGraph?.mainHead),included=commits.filter(c=>onMain.has(c.sha)).length;
 $('main-count').textContent=gitGraph?.mainHead?t('mainCount').replace('{count}',included):'';
 $('development-count').textContent=gitGraph?.mainHead?t('developmentCount').replace('{count}',commits.length-included):'';
 $('graph-window').textContent=gitGraph?.available?t('graphWindow').replace('{count}',commits.length):'';
 for(const [id,mode,palette] of [['release-list','main',['#2563eb','#0f766e','#0891b2']],['commit-list','development',['#7c3aed','#7c3aed','#c2410c']]]){
  const focused=commit=>Boolean(gitGraph?.mainHead)&&(mode==='main'?onMain.has(commit.sha):!onMain.has(commit.sha));
  drawDag($(id),commits,layout,focused,lane=>palette[lane%palette.length],(commit,li)=>{
   li.className='commit '+(focused(commit)?'focused':'muted')+(commit.sha===selectedSha?' selected':'');li.dataset.sha=commit.sha;li.dataset.membership=gitGraph?.mainHead?(onMain.has(commit.sha)?'main':'development'):'unknown';li.tabIndex=0;li.setAttribute('role','button');li.setAttribute('aria-pressed',String(commit.sha===selectedSha));
   const head=text('div','',li);head.className='commit-heading';text('span',commit.sha.slice(0,7),head).className='mono';
   const refs=text('span','',head);refs.className='commit-refs';for(const ref of refsBySha.get(commit.sha)??[]){const tag=text('span',ref.replace(/^refs\/(heads|remotes|tags)\//,''),refs);tag.className='branch-label';tag.title=ref;}
   const title=text('div',commit.subject,li);title.className='commit-title';title.title=commit.subject;
   const meta=text('div','',li);meta.className='commit-meta';text('span',`${commit.author} · ${new Date(Number(commit.time)*1000).toLocaleString(lang)}`,meta);
   for(const version of releasesBySha.get(commit.sha)??[]){const badge=stateBadge(`${version.id} · ${version.id===data.active?.id?t('activeTag'):t('releaseMark')}`,version.id===data.active?.id?'publish':'');badge.title=version.label??version.release_id;meta.append(badge);}
   li.onclick=()=>void selectCommit(commit.sha);li.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();void selectCommit(commit.sha);}};
  });
 }
 scrollers.forEach((node,i)=>{node.scrollTop=scrolls[i][0];node.scrollLeft=scrolls[i][1];});
}

let lang=localStorage.getItem('emergentinc.language')==='en'?'en':'zh-CN',snapshot=null,gitGraph=null,selectedSha='',selectedDetail=null,authenticated=false,sending=false,refreshing=false,prepareKey='',selectedRequest=0;
const $=id=>document.getElementById(id),t=key=>words[lang][key]??key;
function text(tag,value,parent){const node=document.createElement(tag);node.textContent=value;parent.append(node);return node;}
function stateBadge(label,cls){const span=document.createElement('span');span.className='state-badge '+(cls||'');span.textContent=label;return span;}
function translate(){document.documentElement.lang=lang;document.title=t('title')+' · EmergentInc';document.querySelectorAll('[data-text]').forEach(n=>n.textContent=t(n.dataset.text));if(snapshot)render(snapshot);}
async function api(url,body){const response=await fetch(url,{credentials:'same-origin',...(body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{})});const value=await response.json();if(!response.ok){if(response.status===401){authenticated=false;$('content').hidden=true;$('login').hidden=false;}throw new Error(value.detail??String(response.status));}return value;}
function currentSource(){return snapshot?.candidates.find(c=>c.id===snapshot.active?.release_id)?.request?.owner_release?.source_commit??null;}
function targetCandidate(){return snapshot?.candidates.find(c=>['VALIDATED','APPROVED'].includes(c.state)&&c.request?.owner_release?.source_commit===selectedSha&&c.request.base_generation===snapshot.active?.id);}
function render(data){snapshot=data;$('active').textContent=data.active?`${data.active.id} · ${currentSource()?.slice(0,12)??t('geneOnly')}`:'—';$('back').href=data.appUrl+'/OWNER';renderTrees(data);$('selected-commit').hidden=!selectedSha;$('selected-sha').textContent=selectedSha?`${t('selectedCommit')}: ${selectedSha.slice(0,12)}`:'';$('selected-meta').textContent=selectedDetail?.commit.subject??'';
 const ready=targetCandidate(),same=Boolean(selectedSha&&currentSource()===selectedSha);$('switch').disabled=sending||data.busy||!ready||same;$('switch-state').textContent=same?t('same'):data.busy?t('preparing'):ready?t('ready'):data.job?.state==='failed'?t(data.job.error??'failed'):'';
 $('job').hidden=!data.job;if(data.job){$('job-state').textContent=t(data.job.state)+(data.job.error?' · '+t(data.job.error):'');$('log').textContent=data.job.log??'';}}
async function action(body){if(sending||snapshot?.busy)return;sending=true;$('error').textContent='';try{await api('/api/upgrades',body);}catch(e){$('error').textContent=t(e.message);}finally{sending=false;}}
async function selectCommit(sha){if(snapshot?.busy||sending)return;const serial=++selectedRequest;selectedSha=sha;selectedDetail=null;prepareKey='';render(snapshot);try{const detail=await api('/api/git-commit/'+sha);if(serial!==selectedRequest)return;selectedDetail=detail;await refresh();}catch(e){$('error').textContent=t(e.message);}}
async function refresh(){if(!authenticated||refreshing)return;refreshing=true;try{const data=await api('/api/upgrades');if(!gitGraph)gitGraph=await api('/api/git-graph');render(data);
 if(selectedSha&&selectedDetail&&!data.busy&&!targetCandidate()&&currentSource()!==selectedSha){const key=selectedSha+':'+data.active?.id;if(prepareKey!==key){prepareKey=key;const c=selectedDetail.commit;await action({action:'prepare',sourceCommit:selectedSha,version:c.subject.slice(0,200),reason:(c.body||c.subject).slice(0,1000)});}}
 }catch(e){$('error').textContent=t(e.message);}finally{refreshing=false;}}
$('switch').onclick=async()=>{const c=targetCandidate();if(!c)return;await action({action:'publish',id:c.id,hash:c.candidate.candidate_hash});await refresh();};
$('login-form').onsubmit=async event=>{event.preventDefault();try{await api('/api/login',{secret:$('secret').value});$('secret').value='';authenticated=true;$('login').hidden=true;$('content').hidden=false;await refresh();}catch(e){$('error').textContent=t(e.message);}};
$('logout').onclick=async()=>{await api('/api/logout',{});authenticated=false;location.reload();};$('language').onclick=()=>{lang=lang==='en'?'zh-CN':'en';localStorage.setItem('emergentinc.language',lang);translate();};
translate();try{await api('/api/session');authenticated=true;$('login').hidden=true;$('content').hidden=false;await refresh();}catch{}setInterval(()=>void refresh(),1500);
</script></body></html>
