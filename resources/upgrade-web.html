<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发布升级 · EmergentInc</title>
<style>body{margin:0;background:#f5f6f8;color:#17212f;font:16px/1.6 system-ui,sans-serif}main{max-width:900px;margin:40px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center}section{background:white;border:1px solid #e1e5eb;border-radius:12px;padding:24px;margin:20px 0}h1,h2{margin:0 0 12px}label{display:block;margin:12px 0}input,textarea{display:block;box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd2dc;border-radius:6px;font:inherit}button,a.button{border:0;border-radius:6px;padding:10px 16px;background:#204ecf;color:white;font:inherit;cursor:pointer;text-decoration:none}button:disabled{opacity:.45;cursor:default}header button{background:#e1e6f0;color:#17212f;padding:6px 12px}small{color:#536174}pre{overflow:auto;max-height:260px;background:#f3f5f8;padding:12px;white-space:pre-wrap;word-break:break-all}code{word-break:break-all}#error{color:#b42318}#job{border-left:4px solid #204ecf}label.check{display:flex;align-items:flex-start;gap:10px}label.check input{width:auto;margin-top:8px}h3,#active{overflow-wrap:anywhere}small{display:block;color:#657084}.candidate{border-top:1px solid #e1e5eb;padding-top:16px;margin-top:16px}</style></head>
<body><main><header><h1 data-text="title"></h1><div><button id="zh">中文</button> <button id="en">EN</button></div></header>
<p data-text="intro"></p><p id="error" role="alert"></p>
<section id="login"><h2 data-text="login"></h2><form id="login-form"><label><span data-text="secret"></span><input id="secret" type="password" autocomplete="current-password" required></label><button data-text="login"></button></form></section>
<div id="content" hidden><section><h2 data-text="current"></h2><p id="active"></p><a class="button" id="back" data-text="back"></a></section>
<section id="job" hidden aria-live="polite"><h2 id="job-title"></h2><p id="job-state"></p><details><summary data-text="details"></summary><pre id="log"></pre></details><button id="recover" hidden data-text="recover"></button></section>
<section><h2 data-text="prepare"></h2><p data-text="prepareHint"></p><p id="dirty"></p><form id="prepare-form"><label><span data-text="version"></span><input id="version" maxlength="200" data-placeholder="versionPlaceholder" aria-describedby="version-hint"><small id="version-hint" data-text="versionHint"></small></label><label><span data-text="reason"></span><textarea id="reason" rows="2" maxlength="1000" required></textarea></label><button id="prepare" data-text="prepare"></button></form></section>
<section id="code-report" hidden><h2 data-text="codeReport"></h2><div id="code-content"></div></section>
<section><h2 data-text="history"></h2><p data-text="maintenanceHint"></p><label><span data-text="maintenanceReason"></span><input id="maintenance-reason" maxlength="800"></label><div id="history"></div></section>
<section><h2 data-text="candidates"></h2><div id="candidates"></div></section><button id="logout" data-text="logout"></button></div></main>
<script type="module">
const words={
 'zh-CN':{codeReport:'元胞源码改动报告',reporter:'报告人物',reviewCode:'我已审查此次源码改动，批准准备与校验候选版本。发布仍需单独批准。',prepareCode:'准备并校验此源码候选',codePending:'候选源码尚未生效。8766 及共享模块禁止元胞修改，升级服务会再次检查。',reportHash:'报告校验标识',deleted:'删除文件',APP_CODE_REPORT_INVALID:'源码报告标识无效。',APP_CODE_REPORT_CHANGED:'报告内容或校验标识已变化，请重新审查。',APP_CODE_BASE_CHANGED:'候选基于旧版本，请让负责人重新生成。',APP_CODE_PATH_DENIED:'报告涉及禁止修改区，已拒绝。',APP_CODE_REPORT_UNAVAILABLE:'无法从主服务读取源码报告。',APP_CODE_OWNER_AUTH_FAILED:'无法通过主服务 Owner 身份校验。',title:'发布升级',intro:'准备并校验新版本，查看结果后点击发布。升级期间主服务会短暂重启，这个页面会保留进度。',login:'Owner 登录',secret:'本实例的 Owner 口令',current:'当前运行版本',back:'返回 Owner',prepare:'准备并校验版本',prepareHint:'准备过程不会切换当前服务。源码需要先提交，校验通过后才可发布。',version:'版本标签',versionPlaceholder:'留空自动生成',versionHint:'可使用中文、空格和符号，最多 200 个字符。留空时根据当前时间生成标签。',releaseId:'内部版本编号',reason:'本次修改说明',candidates:'发布版本',empty:'暂无已准备的版本。',dirty:'源码尚未提交，请先提交修改再准备版本。',details:'查看校验记录',commit:'源码提交',hash:'版本校验标识',checked:'我已查看修改说明和校验结果，批准发布此版本。',publish:'发布升级',recover:'检查并恢复中断的升级',logout:'退出登录',preparing:'准备并校验版本',publishing:'发布升级',recovering:'检查恢复',running:'处理中…',succeeded:'操作完成。',failed:'操作失败，请查看校验记录。',interrupted:'操作曾中断，请检查并恢复。',validated:'校验通过，待发布',approved:'已批准，待发布',born:'已发布',submitted:'待校验',rolled_back:'已回退',loginError:'Owner 口令错误或登录尝试过多。',network:'无法连接升级服务。',source:'当前代',base:'来源代',pending:'升级尚未完成',VERSION_LABEL_AND_OWNER_REASON_REQUIRED:'请填写修改说明。标签可留空自动生成，手填标签最多 200 个字符，不能包含控制字符。',OWNER_RELEASE_REQUIRES_CLEAN_COMMITTED_CHECKOUT:'请先提交源码修改。',UPGRADE_ALREADY_RUNNING:'已有升级操作正在执行。',UPGRADE_CANDIDATE_CONFLICT:'版本或批准标识已变化，请刷新后重新检查。',ORIGIN_FORBIDDEN:'请求来源不匹配。',VERSION_UPGRADE_ACTION_INVALID:'不支持此操作。',publishBlocked:'候选版本保留，尚未切换版本。',MAIN_SERVICE_UNAVAILABLE:'主服务未启动或无法连接。请先运行 EmergentInc_UI.bat（Linux 使用 EmergentInc_UI.sh），等待启动完成后重试。',MAIN_SERVICE_NOT_READY:'主服务尚未就绪。请等待启动完成，或检查启动日志后重试。',LOCAL_CONTROL_PROCESS_IDENTITY_CONFLICT:'主服务进程或运行代与升级记录不一致。请检查启动日志后重试。'},
 en:{codeReport:'Cell source change report',reporter:'Reported by',reviewCode:'I reviewed this source change and approve preparing and validating the candidate. Publication still requires separate approval.',prepareCode:'Prepare and validate this source candidate',codePending:'Candidate source is not active. Cells cannot modify 8766 or its shared modules; the upgrade service checks this again.',reportHash:'Report verification ID',deleted:'Delete file',APP_CODE_REPORT_INVALID:'Invalid source report ID.',APP_CODE_REPORT_CHANGED:'The report or verification ID changed. Review it again.',APP_CODE_BASE_CHANGED:'The candidate is based on an old version. Ask its author to regenerate it.',APP_CODE_PATH_DENIED:'The report touches protected files and was denied.',APP_CODE_REPORT_UNAVAILABLE:'Cannot read the source report from the main service.',APP_CODE_OWNER_AUTH_FAILED:'Owner authentication with the main service failed.',title:'Publish upgrade',intro:'Prepare and validate a version, review the result, then publish. The main service briefly restarts during the upgrade; this page keeps showing progress.',login:'Owner login',secret:'Owner secret for this instance',current:'Current running version',back:'Back to Owner',prepare:'Prepare and validate version',prepareHint:'Preparation keeps the current service running. Commit source changes first. Publication requires successful validation.',version:'Version label',versionPlaceholder:'Leave blank to generate a label',versionHint:'Use any text, including spaces and symbols, up to 200 characters. Leave blank for a timestamp label.',releaseId:'Release ID',reason:'Change description',candidates:'Release versions',empty:'No prepared versions yet.',dirty:'Source changes are uncommitted. Commit them before preparing a version.',details:'View validation records',commit:'Source commit',hash:'Version verification ID',checked:'I reviewed the changes and validation results and approve publishing this version.',publish:'Publish upgrade',recover:'Check and recover interrupted upgrade',logout:'Log out',preparing:'Version preparation and validation',publishing:'Upgrade publication',recovering:'Recovery check',running:'In progress…',succeeded:'Operation completed.',failed:'Operation failed. Check the validation records.',interrupted:'An operation was interrupted. Check and recover it.',validated:'Validated, ready to publish',approved:'Approved, ready to publish',born:'Published',submitted:'Awaiting validation',rolled_back:'Rolled back',loginError:'Invalid Owner secret or too many login attempts.',network:'Cannot connect to the upgrade service.',source:'Current generation',base:'Base generation',pending:'Upgrade incomplete',VERSION_LABEL_AND_OWNER_REASON_REQUIRED:'Enter a change description. Leave the label blank or use up to 200 characters without control characters.',OWNER_RELEASE_REQUIRES_CLEAN_COMMITTED_CHECKOUT:'Commit source changes first.',UPGRADE_ALREADY_RUNNING:'An upgrade operation is already running.',UPGRADE_CANDIDATE_CONFLICT:'The version or approval identifier changed. Refresh and review it again.',ORIGIN_FORBIDDEN:'Request origin does not match.',VERSION_UPGRADE_ACTION_INVALID:'Unsupported operation.',publishBlocked:'The candidate is retained; no version was switched.',MAIN_SERVICE_UNAVAILABLE:'The main service is stopped or unreachable. Run EmergentInc_UI.bat (EmergentInc_UI.sh on Linux), wait for startup, then retry.',MAIN_SERVICE_NOT_READY:'The main service is not ready. Wait for startup or check the startup log, then retry.',LOCAL_CONTROL_PROCESS_IDENTITY_CONFLICT:'The main process or generation does not match the upgrade records. Check the startup log, then retry.'}
};
Object.assign(words['zh-CN'],{history:'历史版本',maintenanceHint:'选择已发布的历史版本回退；成功回退后，可删除当前代之后的代码版本。业务数据、快照和谱系审计保留。',maintenanceReason:'回退或删除说明',reasonRequired:'请先填写回退或删除说明。',rollback:'回退到此版本',deleteRelease:'删除此代码版本',rollingBack:'回退版本',deletingRelease:'删除代码版本',deleting:'正在删除代码',codeDeleted:'代码已删除，审计记录保留',unavailable:'代码不可用',ROLLBACK_TARGET_INVALID:'当前代或回退目标无效，请刷新后检查。',ROLLBACK_TARGET_NOT_ANCESTOR:'目标不在当前版本的发布链上。',ROLLBACK_HISTORY_UNAVAILABLE:'该历史版本跨越不支持的迁移边界，不能自动回退。',RELEASE_DELETE_DENIED:'仅在回退后允许删除当前代之后的代码版本。',RELEASE_ACTIVE_CHANGED:'当前版本已变化，请刷新后重试。',RELEASE_IDENTITY_CHANGED:'代码版本标识已变化，请刷新后检查。',RELEASE_ACTION_INVALID:'回退或删除参数无效。',RELEASE_DELETE_PATH_DENIED:'代码路径不在受控发布目录内，未删除。',EVOLUTION_RECOVERY_REQUIRED:'存在中断的维护操作，请先检查恢复。',HISTORICAL_RELEASE_INTEGRITY_CONFLICT:'历史代码完整性校验失败，未回退。',PIXEL_RELEASE_AUTH_REQUIRED:'Pixel 维护凭据无效。',IDEMPOTENCY_CONFLICT:'同一请求标识对应了不同操作，已拒绝。'});
Object.assign(words.en,{history:'Version history',maintenanceHint:'Roll back to a published historical version. After a successful rollback, code versions newer than the active generation can be deleted. Business data, snapshots and lineage audit remain.',maintenanceReason:'Rollback or deletion reason',reasonRequired:'Enter a rollback or deletion reason first.',rollback:'Roll back to this version',deleteRelease:'Delete this code version',rollingBack:'Version rollback',deletingRelease:'Code version deletion',deleting:'Deleting code',codeDeleted:'Code deleted; audit retained',unavailable:'Code unavailable',ROLLBACK_TARGET_INVALID:'The active generation or rollback target is invalid. Refresh and review.',ROLLBACK_TARGET_NOT_ANCESTOR:'The target is outside the active release ancestry.',ROLLBACK_HISTORY_UNAVAILABLE:'This history crosses an unsupported migration boundary and cannot be rolled back automatically.',RELEASE_DELETE_DENIED:'Only code versions newer than the active generation may be deleted after rollback.',RELEASE_ACTIVE_CHANGED:'The active version changed. Refresh and retry.',RELEASE_IDENTITY_CHANGED:'The code version identity changed. Refresh and review.',RELEASE_ACTION_INVALID:'Invalid rollback or deletion parameters.',RELEASE_DELETE_PATH_DENIED:'The code path is outside the managed releases directory. Nothing was deleted.',EVOLUTION_RECOVERY_REQUIRED:'An interrupted maintenance operation requires recovery first.',HISTORICAL_RELEASE_INTEGRITY_CONFLICT:'Historical code failed integrity verification. No rollback was performed.',PIXEL_RELEASE_AUTH_REQUIRED:'Invalid Pixel maintenance credential.',IDEMPOTENCY_CONFLICT:'The same request key was used for a different operation and was rejected.'});
Object.assign(words['zh-CN'],{V23_ROLLBACK_DENIED_INSTANCE_PAYMENT_FACTS:'已存在实例付款事实，该旧版本无法保留这些数据，已拒绝回退。',PAYMENT_ROLLBACK_SCHEMA_UNSUPPORTED:'旧版本不兼容当前付款数据库，已拒绝回退。'});
Object.assign(words.en,{V23_ROLLBACK_DENIED_INSTANCE_PAYMENT_FACTS:'Instance payment facts exist and cannot be preserved by this older version. Rollback was denied.',PAYMENT_ROLLBACK_SCHEMA_UNSUPPORTED:'The older version is incompatible with the current payment database. Rollback was denied.'});
Object.assign(words['zh-CN'],{ACTIVE_TRUSTED_RELEASE_CONFLICT:'活动代码、代号与指针不一致，未执行维护操作。'});
Object.assign(words.en,{ACTIVE_TRUSTED_RELEASE_CONFLICT:'The active code, generation and pointer do not match. Maintenance was not performed.'});
let lang=localStorage.getItem('emergentinc.language')==='en'?'en':'zh-CN',snapshot=null,authenticated=false,sending=false,sourceReport=null,reportAttempted=false,reportError='',sourceRenderKey='';
const reviewed=new Set();
const expanded=new Set();
const reportQuery=new URLSearchParams(location.search);
const $=id=>document.getElementById(id),t=key=>words[lang][key]??key;
function translate(){document.documentElement.lang=lang;document.title=t('title')+' · EmergentInc';document.querySelectorAll('[data-text]').forEach(node=>node.textContent=t(node.dataset.text));document.querySelectorAll('[data-placeholder]').forEach(node=>node.placeholder=t(node.dataset.placeholder));if(snapshot)render(snapshot);renderSourceReport();}
function text(tag,value,parent){const node=document.createElement(tag);node.textContent=value;parent.append(node);return node;}
async function api(url,body){const response=await fetch(url,{credentials:'same-origin',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const value=await response.json();if(!response.ok){if(response.status===401)showLogin();throw new Error(value.detail??'network');}return value;}
function showLogin(){sourceReport=null;reportAttempted=false;reportError='';authenticated=false;$('login').hidden=false;$('content').hidden=true;}
function render(data){snapshot=data;$('active').textContent=data.active?`${t('source')}: ${data.active.id} · ${data.active.label??data.active.release_id}`:t('pending');$('back').href=data.appUrl+'/OWNER';$('dirty').textContent=data.dirty?t('dirty'):'';$('prepare').disabled=data.busy||data.dirty||sending;
 const job=data.job;$('job').hidden=!job;if(job){$('job-title').textContent=t(['prepare','prepare-code'].includes(job.action)?'preparing':job.action==='publish'?'publishing':job.action==='rollback'?'rollingBack':job.action==='delete'?'deletingRelease':'recovering')+(job.version?' · '+job.version:'');$('job-state').textContent=words[lang][job.error]??t(job.state);if(job.action==='publish'&&['MAIN_SERVICE_UNAVAILABLE','MAIN_SERVICE_NOT_READY','LOCAL_CONTROL_PROCESS_IDENTITY_CONFLICT'].includes(job.error))$('job-state').textContent+=' '+t('publishBlocked');$('log').textContent=[job.error,job.log].filter(Boolean).join('\n');$('recover').hidden=!['failed','interrupted'].includes(job.state);$('recover').disabled=data.busy||sending;}
 const reason=$('maintenance-reason').value.trim(),history=$('history');history.replaceChildren();
 for(const version of data.versions??[]){const card=text('article','',history);card.className='candidate';text('h3',`${version.id} · ${version.label}`,card);text('small',version.release_id,card);
   if(version.id===data.active?.id)text('p',t('current'),card);else if(!version.available)text('p',t('unavailable'),card);
   if(version.rollbackBlockedReason)text('p',t(version.rollbackBlockedReason),card);
   if(version.canRollback){const button=text('button',t('rollback'),card);button.disabled=!reason||data.busy||sending;button.onclick=()=>action({action:'rollback',targetGeneration:version.id,expectedActive:data.active.id,reason});}
   if(version.canDelete){const button=text('button',t('deleteRelease'),card);button.disabled=!reason||data.busy||sending;button.onclick=()=>action({action:'delete',releaseId:version.release_id,expectedActive:data.active.id,identity:version.identity,reason});}
 }
 const holder=$('candidates');holder.replaceChildren();if(!data.candidates.length)text('p',t('empty'),holder);
 for(const row of data.candidates){const card=text('article','',holder);card.className='candidate';text('h3',row.request.owner_release?.label??row.id,card);if(row.request.owner_release?.label)text('small',`${t('releaseId')}: ${row.id}`,card);text('p',t(row.state==='DELETED'?'codeDeleted':row.state.toLowerCase()),card);text('p',row.request.owner_release?.reason??row.request.app_code_report?.reason??'',card);text('small',`${t('base')}: ${row.request.base_generation}`,card);
  if(row.candidate||row.validationLog){const details=text('details','',card);details.open=expanded.has(row.id);details.ontoggle=()=>details.open?expanded.add(row.id):expanded.delete(row.id);text('summary',t('details'),details);text('p',`${t('commit')}: ${row.request.owner_release?.source_commit??row.request.app_code_report?.hash??'—'}`,details);if(row.candidate)text('code',`${t('hash')}: ${row.candidate.candidate_hash}`,details);if(row.validationLog)text('pre',row.validationLog,details);}
  if(row.failure_reason)text('pre',row.failure_reason,card);
  if(row.canDelete&&!row.target_generation){const button=text('button',t('deleteRelease'),card);button.disabled=!reason||data.busy||sending;button.onclick=()=>action({action:'delete',releaseId:row.id,expectedActive:data.active.id,identity:row.identity,reason});}
  if(['VALIDATED','APPROVED'].includes(row.state)&&row.candidate?.base_generation===data.active?.id){const label=text('label','',card);label.className='check';const check=document.createElement('input');check.type='checkbox';check.checked=reviewed.has(row.candidate.candidate_hash);label.append(check);text('span',t('checked'),label);const button=text('button',t('publish'),card);button.disabled=!check.checked||data.busy||sending;check.onchange=()=>{check.checked?reviewed.add(row.candidate.candidate_hash):reviewed.delete(row.candidate.candidate_hash);button.disabled=!check.checked||data.busy||sending;};button.onclick=()=>action({action:'publish',id:row.id,hash:row.candidate.candidate_hash});}
 }
}
function renderSourceReport(){const key=JSON.stringify([lang,sourceReport?.hash,reportError,Boolean(snapshot?.busy),sending]);if(key===sourceRenderKey)return;sourceRenderKey=key;const section=$('code-report');section.hidden=!sourceReport&&!reportError;const holder=$('code-content');holder.replaceChildren();if(!sourceReport){if(reportError)text('p',t(reportError),holder);return;}text('h3',sourceReport.title,holder);text('p',`${t('reporter')}: ${sourceReport.personName} · ${sourceReport.baseGeneration}`,holder);text('p',sourceReport.summary,holder);text('p',t('codePending'),holder);text('code',`${t('reportHash')}: ${sourceReport.hash}`,holder);for(const file of sourceReport.files){const details=text('details','',holder);text('summary',file.path,details);text('pre',file.content??t('deleted'),details);}const label=text('label','',holder);label.className='check';const check=document.createElement('input');check.type='checkbox';check.checked=reviewed.has(sourceReport.hash);label.append(check);text('span',t('reviewCode'),label);const button=text('button',t('prepareCode'),holder);button.disabled=!check.checked||snapshot?.busy||sending;check.onchange=()=>{check.checked?reviewed.add(sourceReport.hash):reviewed.delete(sourceReport.hash);button.disabled=!check.checked||snapshot?.busy||sending;};button.onclick=()=>action({action:'prepare-code',id:sourceReport.id,hash:sourceReport.hash});}
async function refresh(){if(!authenticated)return;try{render(await api('/api/upgrades'));if(!reportAttempted&&reportQuery.get('report')){reportAttempted=true;try{const r=await api('/api/code-reports/'+encodeURIComponent(reportQuery.get('report')));if(r.hash!==reportQuery.get('reportHash'))throw new Error('APP_CODE_REPORT_CHANGED');sourceReport=r;}catch(e){reportError=e.message;}}renderSourceReport();$('error').textContent='';}catch(error){$('error').textContent=t(error.message);}}
async function action(body){if(sending||snapshot?.busy)return;sending=true;if(snapshot)render(snapshot);renderSourceReport();try{await api('/api/upgrades',body);await refresh();}catch(error){$('error').textContent=t(error.message);}finally{sending=false;if(snapshot)render(snapshot);renderSourceReport();}}
$('login-form').onsubmit=async event=>{event.preventDefault();try{await api('/api/login',{secret:$('secret').value});$('secret').value='';authenticated=true;$('login').hidden=true;$('content').hidden=false;await refresh();}catch{$('error').textContent=t('loginError');}};
$('prepare-form').onsubmit=event=>{event.preventDefault();void action({action:'prepare',version:$('version').value,reason:$('reason').value});};
$('recover').onclick=()=>action({action:'recover'});$('logout').onclick=async()=>{await api('/api/logout',{});showLogin();};
$('maintenance-reason').oninput=()=>{if(snapshot)render(snapshot);};
for(const [id,value] of [['zh','zh-CN'],['en','en']])$(id).onclick=()=>{lang=value;localStorage.setItem('emergentinc.language',lang);translate();};
translate();try{authenticated=(await api('/api/session')).authenticated;if(authenticated){$('login').hidden=true;$('content').hidden=false;await refresh();}}catch{$('error').textContent=t('network');}
setInterval(refresh,2000);
</script></body></html>
